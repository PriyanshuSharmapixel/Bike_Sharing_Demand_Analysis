[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-demand-case-study"
version = "1.0.0"
description = "Reproducible bike rental forecasting and operations decision prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.6,<1.9", "matplotlib>=3.8,<4", "joblib>=1.3,<2",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
